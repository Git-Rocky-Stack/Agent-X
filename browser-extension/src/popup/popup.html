<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>AgentX Web Clipper</title>
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="popup-title">AgentX Clipper</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking...</span>
      </div>
    </header>

    <section class="clip-actions">
      <button class="clip-btn" id="clipFull" data-mode="full">
        <span class="clip-btn-icon">&#9878;</span>
        <span class="clip-btn-label">Full Page</span>
      </button>
      <button class="clip-btn" id="clipSelection" data-mode="selection">
        <span class="clip-btn-icon">&#9998;</span>
        <span class="clip-btn-label">Selection</span>
      </button>
      <button class="clip-btn" id="clipReader" data-mode="reader">
        <span class="clip-btn-icon">&#9784;</span>
        <span class="clip-btn-label">Reader Mode</span>
      </button>
    </section>

    <section class="batch-action">
      <button class="clip-btn clip-btn-batch" id="clipAllTabs">
        <span class="clip-btn-icon">&#10697;</span>
        <span class="clip-btn-label">Clip All Tabs</span>
      </button>
    </section>

    <!-- Live region so screen readers announce pairing/clip results (AX-QA-015).
         showFeedback() escalates aria-live to "assertive" for errors. -->
    <div class="feedback-area" id="feedbackArea" role="status" aria-live="polite" aria-atomic="true"></div>

    <section class="pairing" id="pairingSection">
      <h2 class="section-title">Connection</h2>
      <p class="pairing-hint">Paste the API token from AgentX &rarr; Settings &rarr; Connections to pair this extension.</p>
      <div class="pairing-row">
        <input type="password" class="pairing-input" id="apiToken" placeholder="API token" autocomplete="off" spellcheck="false" aria-label="AgentX API token">
        <button class="clip-btn pairing-save" id="saveToken">
          <span class="clip-btn-label">Save</span>
        </button>
      </div>
    </section>

    <section class="recent-clips">
      <h2 class="section-title">Recent Clips</h2>
      <ul class="clip-list" id="clipList">
        <li class="clip-list-empty" id="clipListEmpty">No clips yet</li>
      </ul>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
