name: Extension CI

# AX-QA-006: the browser extension previously had no CI gate. This lints, type-checks, and builds the
# extension and audits its whole dependency tree on every change under browser-extension/.

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/**'
      - '.github/workflows/extension-ci.yml'
  pull_request:
    paths:
      - 'browser-extension/**'
      - '.github/workflows/extension-ci.yml'

defaults:
  run:
    working-directory: browser-extension

jobs:
  build:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (production)
        run: npm run build

      # Every package in package.json is a devDependency, so `npm audit --omit=dev` audited an empty
      # set and could never fail. The toolchain (webpack, ts-loader, terser) produces the bundle that
      # ships, so audit the full tree and fail on any high or critical advisory.
      - name: Audit dependencies (full tree)
        run: npm audit --audit-level=high

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          path: browser-extension/dist
