name: Android Build

# AX-QA-004: compile-verify the AgentX.Mobile MAUI companion (net8.0-android). The mobile
# project is intentionally NOT in AgentX.sln — its MAUI workloads would break the Windows
# desktop build — so this dedicated job installs the maui-android workload and builds the
# Android target. The mobile code (incl. the AX-QA-005 transport hardening) can no longer
# drift compile-unverified.
#
# iOS is not built here: it requires a macOS runner toolchain (tracked under AX-QA-004).

on:
  push:
    branches: [main]
    paths:
      - 'src/AgentX.Mobile/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'src/AgentX.Mobile/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    name: Build AgentX.Mobile (net8.0-android)
    runs-on: ubuntu-latest
    # Hard gate (blocking). The mobile project — including the AX-QA-005 transport hardening — builds
    # clean for net8.0-android. The earlier "compile-unverified" status (AX-QA-004) was a wrong-API
    # bug in MauiProgram.cs (a non-existent parameterless `.UseMaui()`), now fixed to `.UseMauiApp<App>()`
    # and verified by a local MAUI build loop (Debug + Release, 0 warnings). See docs/MOBILE-TRANSPORT.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # On Linux the csproj resolves TargetFrameworks to net8.0-android only (iOS is conditioned
      # out there), so a plain build needs no TFM override and the MAUI SDK's implicit framework
      # references stay intact. iOS build remains deferred (needs macOS).
      - name: Build (Release, net8.0-android)
        run: dotnet build src/AgentX.Mobile/AgentX.Mobile.csproj -c Release
